<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" type="text/css" href="css/gameboy.css" />
    <link rel="stylesheet" type="text/css" href="css/cart.css" />
    <script src="js/tota11y.min.js"></script>
</head>
<body>
  <header>
    <h1>Pokédex</h1>
  </header>
  <div class="main">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  </div 
    class="contatiner-fluid flex-column flex-sm-ro align0items-center justify-content-between"
    >
    <a class="navbar-brand text-center text-sm-start" href="#"></a>
          <img
            src="img/pokemon.svg"
            alt="Pokemon logo."
            class="page-header_item logo-img"
            draggable="false"
          />
          <div class="flex-grow-1 d-none d-sm-block"></div>
          <a class="navbar-brand text-center text-sm-end" href="#"></a>
          <img
            src="img/Nintendo_red_logo.svg"
            alt="Nintendo logo."
            height="75"
            class="page-header_item logo-img"
            draggable="false"
          />
          <!-- Search Bar -->
  <div class="search-container">
    <input
      type="text"
      id="search-input"
      placeholder="Search Pokémon..."
      aria-label="Search Pokémon by name"
    />
  </div>
        </div>
      </nav>


  

  

  <main>
    <ul id="pokemon-list" class="pokemon-list">
      <!-- Pokémon buttons will be injected here by JavaScript -->
    </ul>
  </main>

  <!-- Modal -->
  <div id="modal-container" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">×</button>
      <h2 id="modal-name"></h2>
      <img id="modal-image" src="" alt="Pokémon image">
      <p><strong>Height:</strong> <span id="modal-height"></span></p>
      <p><strong>Types:</strong> <span id="modal-types"></span></p>
    </div>
  </div>

  <script src="/src/js/scripts.js"></script>
</body>
</html>
